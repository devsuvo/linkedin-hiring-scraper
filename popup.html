<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 360px; font-family: Segoe UI, Arial, sans-serif; margin: 12px; }
  h3 { margin: 0 0 4px; color: #0a66c2; }
  .sub { font-size: 12px; color: #555; margin-bottom: 8px; }
  button { padding: 8px; margin: 4px 0; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .full { width: 100%; }
  #dl { background: #0a66c2; color: #fff; }
  select { width: 100%; padding: 6px; margin-top: 6px; }
  .row { display: flex; gap: 6px; } .row button { flex: 1; }
  .gray { background: #eee; }
  #run { background: #16a34a; color: #fff; font-size: 14px; }
  #run.on { background: #dc2626; }
  #run:disabled { background: #aaa; cursor: not-allowed; }
  .top { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid #ddd; }
  .switch { position: relative; width: 42px; height: 22px; display: inline-block; margin: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; cursor: pointer; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #16a34a; }
  .switch input:checked + .slider:before { transform: translateX(20px); }
  #enabledTxt { font-weight: 700; font-size: 13px; }
  #list { max-height: 240px; overflow: auto; margin-top: 8px; font-size: 12px; }
  .item { border-bottom: 1px solid #ddd; padding: 6px 0; }
  .item a { color: #0a66c2; word-break: break-all; }
  label { font-size: 13px; display: block; margin: 6px 0; }
</style>
</head>
<body>
  <div class="top">
    <b>Extension</b>
    <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
    <span id="enabledTxt"></span>
  </div>
  <h3>Today: <span id="count">0</span> hiring posts</h3>
  <div class="sub" id="today"></div>
  <button id="run" class="full">▶ Run Auto-scroll</button>
  <div class="sub" id="last"></div>
  <div class="sub">⏰ Protidin dupur 1tar por notification ashbe — "Download" chaple tobei download hobe.</div>
  <button id="dl" class="full">Download Today's Word File</button>
  <button id="folder" class="full gray">📂 Open Download Folder</button>
  <select id="days"></select>
  <div class="row">
    <button id="dlDay" class="gray">Download selected day</button>
    <button id="clearDay" class="gray">Clear selected day</button>
  </div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
